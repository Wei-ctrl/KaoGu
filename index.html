<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>KaoGu</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">KaoGu</a>
    <button class="back" id="back" type="button" hidden>&larr; Subjects</button>
  </header>

  <main id="app" tabindex="-1"></main>

  <template id="tpl-home">
    <section class="home">
      <h1>Choose a subject</h1>
      <p class="lede">Pick where you want to start.</p>
      <ul class="subjects" id="subjects"></ul>
    </section>
  </template>

  <template id="tpl-subject">
    <section class="subject">
      <p class="index"></p>
      <h1 class="title"></h1>
      <p class="native"></p>
      <p class="empty">Content for this subject is coming soon.</p>
    </section>
  </template>

  <template id="tpl-quiz">
    <section class="quiz">
      <div class="quiz-head">
        <span class="quiz-subject"></span>
        <span class="quiz-count" aria-live="polite"></span>
      </div>
      <div class="progress" aria-hidden="true"><div class="progress-bar"></div></div>
      <p class="q-tag"></p>
      <p class="q-given"></p>
      <p class="sentence"></p>
      <figure class="q-figure" hidden></figure>
      <p class="q-hint"></p>
      <div class="options" role="group" aria-label="Answer choices"></div>
      <div class="slots" hidden>
        <div class="slot-row"></div>
        <div class="keypad">
          <button class="key" type="button" data-key="1">1</button>
          <button class="key" type="button" data-key="2">2</button>
          <button class="key" type="button" data-key="3">3</button>
          <button class="key" type="button" data-key="4">4</button>
          <button class="key" type="button" data-key="5">5</button>
          <button class="key" type="button" data-key="6">6</button>
          <button class="key" type="button" data-key="7">7</button>
          <button class="key" type="button" data-key="8">8</button>
          <button class="key" type="button" data-key="9">9</button>
          <button class="key" type="button" data-key="-">−</button>
          <button class="key" type="button" data-key="0">0</button>
          <button class="key" type="button" data-key="back" aria-label="Delete">⌫</button>
        </div>
      </div>
      <button class="btn btn-primary check" type="button" hidden>Check</button>
      <div class="feedback" aria-live="polite" hidden>
        <p class="verdict"></p>
        <p class="explain"></p>
        <p class="terms"></p>
        <button class="link ask-tutor" type="button" hidden>Ask the tutor about this question &rarr;</button>
      </div>
      <button class="btn btn-primary next" type="button" hidden>Next</button>
    </section>
  </template>

  <template id="tpl-results">
    <section class="results">
      <p class="index"></p>
      <h1 class="score"></h1>
      <p class="lede score-note"></p>
      <div class="actions">
        <button class="btn btn-primary retry" type="button">Try again</button>
        <a class="btn" href="#/">All subjects</a>
        <button class="btn ask-tutor" type="button" hidden>Go over mistakes with the tutor</button>
      </div>
      <h2 class="review-title"></h2>
      <ol class="review"></ol>
    </section>
  </template>

  <template id="tpl-tutor">
    <section class="tutor" lang="zh-Hant">
      <div class="tutor-head">
        <div>
          <p class="index" lang="en">Chemistry · 化學</p>
          <h1 lang="en">Tutor</h1>
        </div>
        <div class="tutor-tools" lang="en">
          <button class="link tutor-new" type="button">New chat</button>
          <button class="link tutor-settings" type="button">Settings</button>
        </div>
      </div>

      <form class="tutor-setup" lang="en" hidden>
        <label class="field">
          <span>Claude API key</span>
          <input class="tutor-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
        </label>
        <label class="field">
          <span>Model</span>
          <select class="tutor-model"></select>
        </label>
        <p class="hint">Your key is saved only in this browser and sent only to Anthropic's API. Create one at console.anthropic.com → API keys. Each message is billed to that account.</p>
        <div class="actions">
          <button class="btn btn-primary" type="submit">Save</button>
          <button class="btn tutor-forget" type="button">Forget key</button>
        </div>
      </form>

      <ol class="chat" aria-live="polite"></ol>
      <div class="starters" lang="en"></div>
      <p class="tutor-status" lang="en" aria-live="polite"></p>

      <form class="composer">
        <textarea class="composer-input" rows="1" placeholder="Ask a question… 問化學問題" aria-label="Message"></textarea>
        <button class="btn btn-primary composer-send" type="submit" lang="en">Send</button>
      </form>
    </section>
  </template>

  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="data/maths/index.js"></script>
  <script src="data/english-text/index.js"></script>
  <script src="data/english-grammar/index.js"></script>
  <script src="data/chemistry/index.js"></script>
  <script src="vendor/anthropic/sdk.min.js" defer></script>
  <script src="tutor/chemistry-prompt.js"></script>
  <script src="tutor/tutor.js"></script>
  <script src="app.js"></script>
</body>
</html>
